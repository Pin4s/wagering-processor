services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sqs
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SQS_WAGER_TRANSACTIONS_QUEUE: ${SQS_WAGER_TRANSACTIONS_QUEUE:-wager-transactions.fifo}
      SQS_WAGER_TRANSACTIONS_DLQ: ${SQS_WAGER_TRANSACTIONS_DLQ:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE: ${SQS_EVENTS_QUEUE:-wagering-events.fifo}
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    ports:
      - "4566:4566"

volumes:
  pgdata:
